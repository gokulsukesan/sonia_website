<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>S&amp;S Kurd Legacy | Luxury Garments</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0b0b0e;
      --panel:#111116;
      --text:#f4f1e8;
      --muted:#c9c1ae;
      --gold:#caa25a;
      --gold2:#f0d49a;
      --shadow:0 14px 40px rgba(0,0,0,.55);
      --brand-font:'Cinzel',serif;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }

    a{color:inherit;text-decoration:none}
    .wrap{max-width:1150px;margin:0 auto;padding:18px}

    /* HEADER */
    .topbar{
      position:sticky;top:0;z-index:10;
      background:rgba(11,11,14,.9);
      backdrop-filter:blur(10px);
      border-bottom:1px solid rgba(255,255,255,.06);
    }
    .topbar .inner{
      max-width:1150px;margin:0 auto;
      padding:14px 18px;
      display:flex;justify-content:space-between;align-items:center;
    }

    .brand{display:flex;gap:12px;align-items:center}
    .brand img{width:44px;height:44px;border-radius:50%}
    .brand .name{
      font-family:var(--brand-font);
      letter-spacing:.08em;
      color:var(--gold);
      font-weight:700;
    }
    .brand .tag{font-size:13px;color:var(--muted)}

    nav{display:none;gap:18px}
    nav a{
      font-family:var(--brand-font);
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    .btn{
      padding:12px 14px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.1);
      background:rgba(255,255,255,.05);
      font-weight:700;
    }
    .btn.gold{
      border-color:rgba(202,162,90,.55);
      background:linear-gradient(135deg,rgba(202,162,90,.25),rgba(240,212,154,.12));
    }

    /* HERO */
    .hero{
      margin-top:18px;
      padding:24px;
      background:var(--panel);
      border-radius:24px;
      box-shadow:var(--shadow);
    }
    h1,h2{
      font-family:var(--brand-font);
      letter-spacing:.08em;
      color:var(--gold);
    }

    /* CONTACT */
    .contact{
      margin-top:40px;
    }

    .contact-icons{
      display:flex;
      gap:16px;
      margin-top:12px;
      align-items:center;
    }

    /* 🔒 HARD-LOCKED ICON SIZE */
    .contact-icons svg{
      width:18px !important;
      height:18px !important;
      display:block;
      stroke-width:1.8;
    }

    .contact-icons a{
      line-height:0;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      transition:transform .15s ease,opacity .15s ease;
    }

    .contact-icons a:hover{
      transform:translateY(-1px) scale(1.08);
      opacity:.95;
    }

    .contact-icons a.email{color:var(--gold2)}
    .contact-icons a.instagram{color:#ff4fd8}

    @media(min-width:760px){
      nav{display:flex}
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="inner">
    <div class="brand">
      <img src="images/Sonia_Icon.png" alt="logo">
      <div>
        <div class="name">S&amp;S Kurd Legacy</div>
        <div class="tag">Luxury garments • Shahla Sonia</div>
      </div>
    </div>

    <nav>
      <a href="#contact">Contact</a>
      <a href="https://www.instagram.com/imperial.kurd.maison" target="_blank">Instagram</a>
    </nav>

    <a class="btn gold" href="#contact">Inquire</a>
  </div>
</header>

<main class="wrap">

  <section class="hero">
    <h1>Luxury garments with timeless elegance.</h1>
    <p>Refined silhouettes, crafted details, and signature designs.</p>
  </section>

  <section id="contact" class="contact">
    <h2>Contact</h2>

    <div class="contact-icons">
      <!-- EMAIL -->
      <a class="email" href="mailto:oniaebrahimi88@icloud.com" aria-label="Email">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M4 4h16v16H4z"/>
          <path d="M22 6l-10 7L2 6"/>
        </svg>
      </a>

      <!-- INSTAGRAM -->
      <a class="instagram"
         href="https://www.instagram.com/imperial.kurd.maison"
         target="_blank"
         aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <rect x="2" y="2" width="20" height="20" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="0.5"/>
        </svg>
      </a>
    </div>
  </section>

</main>

</body>
</html>
