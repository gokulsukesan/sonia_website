<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>S&amp;S Kurd Legacy | Luxury Garments</title>
  <meta name="description" content="S&S Kurd Legacy — luxury garments. Browse our curated collection." />
  <meta name="theme-color" content="#0b0b0e" />

  <style>
    :root{
      --bg:#0b0b0e;
      --panel:#111116;
      --panel2:#15151c;
      --text:#f4f1e8;
      --muted:#c9c1ae;
      --gold:#caa25a;
      --gold2:#f0d49a;
      --border:rgba(202,162,90,.22);
      --shadow: 0 14px 40px rgba(0,0,0,.55);
      --r:18px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(900px 480px at 20% 10%, rgba(202,162,90,.18), transparent 60%),
        radial-gradient(800px 460px at 90% 20%, rgba(240,212,154,.10), transparent 60%),
        var(--bg);
      color:var(--text);
      line-height:1.55;
    }
    a{color:inherit; text-decoration:none}
    .wrap{max-width:1150px; margin:0 auto; padding:18px}

    .topbar{
      position:sticky; top:0; z-index:30;
      backdrop-filter: blur(10px);
      background: linear-gradient(to bottom, rgba(11,11,14,.86), rgba(11,11,14,.55));
      border-bottom:1px solid rgba(255,255,255,.06);
    }
    .topbar .inner{
      max-width:1150px; margin:0 auto; padding:14px 18px;
      display:flex; align-items:center; justify-content:space-between; gap:14px;
    }
    .brand{display:flex; align-items:center; gap:12px}
    .brand img{
      width:44px; height:44px; border-radius:999px;
      object-fit:cover; box-shadow: var(--shadow);
      border:1px solid rgba(202,162,90,.35);
      background:#000;
    }
    .brand .name{font-weight:800}
    .brand .tag{color:var(--muted); font-size:13px}

    nav{display:none; gap:18px; font-weight:650}
    nav a:hover{color:var(--gold2)}

    .btn{
      padding:12px 14px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
      font-weight:750;
      min-height:44px;
    }
    .btn.gold{
      border:1px solid rgba(202,162,90,.55);
      background: linear-gradient(135deg, rgba(202,162,90,.22), rgba(240,212,154,.10));
    }

    .heroMedia{
      min-height:220px;
      background:
        linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,.45)),
        url("images/hero.jpg");
      background-size:cover;
      background-position:center;
    }

    .section{margin-top:20px}
    .grid{
      display:grid;
      gap:12px;
      grid-template-columns:1fr;
    }
    .card{
      border-radius:18px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.08);
      background:#15151c;
      cursor:pointer;
    }

    .img{
      width:100%;
      aspect-ratio:4/5;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#0b0b0e;
      color:rgba(201,193,174,.85);
      font-weight:750;
      letter-spacing:.2px;
    }

    .img[data-missing="1"]{
      text-align:center;
    }

    .meta{padding:12px}
    .price{color:var(--gold2); font-weight:850}

    @media (min-width:760px){
      nav{display:flex}
      .grid{grid-template-columns:repeat(4,1fr)}
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="inner">
    <div class="brand">
      <img src="images/Sonia_Icon.png" alt="S&S Kurd Legacy logo" />
      <div>
        <div class="name">S&amp;S Kurd Legacy</div>
        <div class="tag">Luxury garments • Shahla Sonia</div>
      </div>
    </div>
    <nav>
      <a href="#collection">Collection</a>
      <a href="#contact">Contact</a>
    </nav>
    <a class="btn gold" href="#collection">Browse</a>
  </div>
</header>

<main class="wrap">
  <section id="collection" class="section">
    <h2>Collection</h2>
    <div class="grid" id="grid">
      <article class="card">
        <img class="img" src="images/p1.jpg" alt="Gold Detail Dress" />
        <div class="meta">
          <strong>Gold Detail Dress</strong>
          <div class="price">Inquire</div>
        </div>
      </article>

      <article class="card">
        <img class="img" src="images/p2.jpg" alt="Luxury Two-Piece Set" />
        <div class="meta">
          <strong>Luxury Two-Piece Set</strong>
          <div class="price">Inquire</div>
        </div>
      </article>
    </div>
  </section>
</main>

<script>
  // Replace broken images with luxury placeholder
  document.querySelectorAll('img.img').forEach(img => {
    img.addEventListener('error', () => {
      const placeholder = document.createElement('div');
      placeholder.className = 'img';
      placeholder.setAttribute('data-missing','1');
      placeholder.textContent = 'Image coming soon';
      img.replaceWith(placeholder);
    }, { once:true });
  });
</script>

</body>
</html>
