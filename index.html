<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>S&amp;S Kurd Legacy | Luxury Garments</title>
  <meta name="description" content="S&S Kurd Legacy — luxury garments. Browse our curated collection." />
  <meta name="theme-color" content="#0b0b0e" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0b0b0e;
      --panel:#111116;
      --panel2:#15151c;
      --text:#f4f1e8;
      --muted:#c9c1ae;
      --gold:#caa25a;
      --gold2:#f0d49a;
      --shadow: 0 14px 40px rgba(0,0,0,.55);
      --r:18px;
      --brand-font:'Cinzel', serif;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    a{text-decoration:none;color:inherit}
    .wrap{max-width:1150px;margin:0 auto;padding:18px}

    /* HEADER */
    .topbar{
      position:sticky;top:0;z-index:20;
      backdrop-filter:blur(10px);
      background:rgba(11,11,14,.85);
      border-bottom:1px solid rgba(255,255,255,.06);
    }
    .topbar .inner{
      max-width:1150px;margin:0 auto;
      padding:14px 18px;
      display:flex;align-items:center;justify-content:space-between;
    }
    .brand{display:flex;gap:12px;align-items:center}
    .brand img{
      width:44px;height:44px;border-radius:50%;
      border:1px solid rgba(202,162,90,.35);
    }
    .brand .name{
      font-family:var(--brand-font);
      color:var(--gold);
      letter-spacing:.08em;
      font-weight:700;
    }
    .brand .tag{font-size:13px;color:var(--muted)}

    nav{display:none;gap:18px}
    nav a{
      font-family:var(--brand-font);
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    .btn{
      padding:12px 14px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.1);
      background:rgba(255,255,255,.05);
      font-weight:700;
    }
    .btn.gold{
      border-color:rgba(202,162,90,.5);
      background:linear-gradient(135deg,rgba(202,162,90,.25),rgba(240,212,154,.1));
    }

    /* HERO */
    .heroCard{
      border-radius:24px;
      overflow:hidden;
      background:var(--panel);
      box-shadow:var(--shadow);
    }
    .heroGrid{display:grid;grid-template-columns:1fr}
    .heroText{padding:24px}
    .pill{
      display:inline-block;
      padding:8px 12px;
      border-radius:999px;
      border:1px solid rgba(202,162,90,.3);
      background:rgba(202,162,90,.1);
      font-family:var(--brand-font);
      color:var(--gold2);
      font-size:13px;
    }
    h1{
      font-family:var(--brand-font);
      color:var(--gold);
      letter-spacing:.08em;
      margin:12px 0;
    }
    .heroMedia{
      min-height:260px;
      background:url("images/hero.png") center/cover no-repeat;
      cursor:zoom-in;
    }

    /* COLLECTION */
    h2{
      font-family:var(--brand-font);
      color:var(--gold);
      letter-spacing:.08em;
      margin-top:32px;
    }
    .grid{
      display:grid;
      gap:12px;
      grid-template-columns:1fr;
    }
    .card{
      border-radius:18px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.08);
      background:var(--panel2);
    }
    .img{
      width:100%;
      aspect-ratio:4/5;
      object-fit:cover;
      display:block;
    }
    .meta{padding:12px}
    .price{
      color:var(--gold2);
      font-weight:800;
    }

    /* Inquire button */
    .price.inquire{
      background:none;
      border:none;
      padding:0;
      cursor:pointer;
      font-family:inherit;
    }
    .price.inquire:hover{text-decoration:underline}

    /* LIGHTBOX */
    #lightbox{
      position:fixed;inset:0;
      background:rgba(0,0,0,.92);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:100;
    }
    #lightbox[aria-hidden="false"]{display:flex}
    #lightbox img{
      max-width:95vw;
      max-height:95vh;
      object-fit:contain;
      border-radius:6px;
    }

    @media(min-width:760px){
      nav{display:flex}
      .grid{grid-template-columns:repeat(4,1fr)}
      .heroGrid{grid-template-columns:1.2fr .8fr}
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="inner">
    <div class="brand">
      <img src="images/Sonia_Icon.png" alt="Logo">
      <div>
        <div class="name">S&amp;S Kurd Legacy</div>
        <div class="tag">Luxury garments • Shahla Sonia</div>
      </div>
    </div>
    <nav>
      <a href="#collection">Collection</a>
      <a href="https://www.instagram.com/imperial.kurd.maison" target="_blank">Instagram</a>
    </nav>
    <a class="btn gold" href="#collection">Browse</a>
  </div>
</header>

<main class="wrap">

<section class="hero">
  <div class="heroCard">
    <div class="heroGrid">
      <div class="heroText">
        <div class="pill">Custom & Ready-to-Wear • Trusted for 20+ Years • Canada-North York</div>
        <h1>Luxury garments with timeless elegance.</h1>
      </div>
      <div class="heroMedia" data-full="images/hero.png"></div>
    </div>
  </div>
</section>

<section id="collection">
  <h2>Collection</h2>
  <div class="grid">

    <article class="card">
      <img class="img" src="images/p1.png" alt="Decorative Panel Dress">
      <div class="meta">
        <strong>Decorative Panel Dress</strong><br>
        <button class="price inquire" data-product="Decorative Panel Dress">Inquire</button>
      </div>
    </article>

    <article class="card">
      <img class="img" src="images/p2.png" alt="Gold and Black Full-Length Dress">
      <div class="meta">
        <strong>Gold and Black Full-Length Dress</strong><br>
        <button class="price inquire" data-product="Gold and Black Full-Length Dress">Inquire</button>
      </div>
    </article>

    <article class="card">
      <img class="img" src="images/p3.png" alt="Signature Abaya">
      <div class="meta">
        <strong>Signature Abaya</strong><br>
        <button class="price inquire" data-product="Signature Abaya">Inquire</button>
      </div>
    </article>

    <article class="card">
      <img class="img" src="images/p4.png" alt="White Embellished Long Dress">
      <div class="meta">
        <strong>White Embellished Long Dress</strong><br>
        <button class="price inquire" data-product="White Embellished Long Dress">Inquire</button>
      </div>
    </article>

  </div>
</section>

</main>

<div id="lightbox" aria-hidden="true">
  <img id="lightbox-img" alt="">
</div>

<script>
  // Lightbox
  const lightbox=document.getElementById('lightbox');
  const lbImg=document.getElementById('lightbox-img');

  document.querySelectorAll('.img').forEach(img=>{
    img.addEventListener('click',()=>{
      lbImg.src=img.src;
      lightbox.setAttribute('aria-hidden','false');
      document.body.style.overflow='hidden';
    });
  });

  lightbox.addEventListener('click',()=>{
    lightbox.setAttribute('aria-hidden','true');
    lbImg.src='';
    document.body.style.overflow='';
  });

  // Instagram DM
  document.querySelectorAll('.price.inquire').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const product=btn.dataset.product;
      const msg=
`Hello,
I’m interested in the ${product} shown on your page.
Could you please let me know the price, available sizes, and delivery options?

Thank you.`;
      const url=`https://www.instagram.com/direct/new/?text=${encodeURIComponent(msg)}`;
      window.open(url,'_blank');
    });
  });
</script>

</body>
</html>
