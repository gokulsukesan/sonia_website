<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>S&amp;S Kurd Legacy | Luxury Garments</title>
  <meta name="description" content="S&S Kurd Legacy — luxury garments. Browse our curated collection." />
  <meta name="theme-color" content="#0b0b0e" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0b0b0e;
      --panel:#111116;
      --panel2:#15151c;
      --text:#f4f1e8;
      --muted:#c9c1ae;
      --gold:#caa25a;
      --gold2:#f0d49a;
      --border:rgba(202,162,90,.22);
      --shadow: 0 14px 40px rgba(0,0,0,.55);
      --r:18px;
      --brand-font:'Cinzel',serif;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }

    a{color:inherit;text-decoration:none}
    .wrap{max-width:1150px;margin:0 auto;padding:18px}

    /* TOP BAR */
    .topbar{
      position:sticky;top:0;z-index:30;
      background:rgba(11,11,14,.85);
      backdrop-filter:blur(10px);
      border-bottom:1px solid rgba(255,255,255,.06);
    }
    .topbar .inner{
      max-width:1150px;margin:0 auto;padding:14px 18px;
      display:flex;justify-content:space-between;align-items:center;
    }

    .brand{display:flex;gap:12px;align-items:center}
    .brand img{
      width:44px;height:44px;border-radius:50%;
      border:1px solid rgba(202,162,90,.35);
    }
    .brand .name{
      font-family:var(--brand-font);
      letter-spacing:.08em;
      color:var(--gold);
      font-weight:700;
    }
    .brand .tag{font-size:13px;color:var(--muted)}

    nav{display:none;gap:18px}
    nav a{
      font-family:var(--brand-font);
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    .btn{
      padding:12px 14px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.1);
      background:rgba(255,255,255,.05);
      font-weight:700;
    }
    .btn.gold{
      border-color:rgba(202,162,90,.55);
      background:linear-gradient(135deg,rgba(202,162,90,.25),rgba(240,212,154,.12));
    }

    /* HERO */
    .heroCard{
      margin-top:18px;
      border-radius:24px;
      overflow:hidden;
      background:var(--panel);
      border:1px solid rgba(255,255,255,.08);
      box-shadow:var(--shadow);
    }
    .heroText{padding:24px}
    h1,h2{
      font-family:var(--brand-font);
      letter-spacing:.08em;
      color:var(--gold);
    }

    /* COLLECTION */
    .grid{
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
    }
    .card{
      background:#15151c;
      border-radius:18px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.08);
    }
    .img{width:100%;aspect-ratio:4/5;object-fit:cover}
    .meta{padding:12px}
    .price.inquire{
      background:none;border:none;
      color:var(--gold2);
      font-weight:700;
      cursor:pointer;
    }

    /* CONTACT ICONS */
    .contact-icons{
      display:flex;
      gap:14px;
      margin-top:12px;
      align-items:center;
    }
    .contact-icons .icon{
      width:18px;
      height:18px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      transition:transform .15s ease,opacity .15s ease;
    }
    .contact-icons .icon:hover{
      transform:translateY(-1px) scale(1.12);
      opacity:1;
    }
    .contact-icons .email{color:var(--gold2)}
    .contact-icons .instagram{color:#ff4fd8}
    .contact-icons svg{
      width:100%;
      height:100%;
      stroke-width:1.7;
    }

    @media(min-width:760px){
      nav{display:flex}
      .grid{grid-template-columns:repeat(4,1fr)}
    }
  </style>
</head>

<body>
<header class="topbar">
  <div class="inner">
    <div class="brand">
      <img src="images/Sonia_Icon.png" alt="logo">
      <div>
        <div class="name">S&amp;S Kurd Legacy</div>
        <div class="tag">Luxury garments • Shahla Sonia</div>
      </div>
    </div>

    <nav>
      <a href="#collection">Collection</a>
      <a href="#contact">Contact</a>
      <a href="https://www.instagram.com/imperial.kurd.maison" target="_blank">Instagram</a>
    </nav>

    <a class="btn gold" href="#collection">Browse</a>
  </div>
</header>

<main class="wrap">
  <section class="heroCard">
    <div class="heroText">
      <h1>Luxury garments with timeless elegance.</h1>
      <p>Explore signature styles crafted with refined silhouettes.</p>
    </div>
  </section>

  <section id="collection">
    <h2>Collection</h2>
    <div class="grid">
      <!-- products unchanged -->
    </div>
  </section>

  <section id="contact">
    <h2>Contact</h2>
    <div class="contact-icons">
      <a class="icon email" href="mailto:soniaebrahimi88@icloud.com" aria-label="Email">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M4 4h16v16H4z"/>
          <path d="M22 6l-10 7L2 6"/>
        </svg>
      </a>

      <a class="icon instagram"
         href="https://www.instagram.com/imperial.kurd.maison"
         target="_blank"
         aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <rect x="2" y="2" width="20" height="20" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="0.5"/>
        </svg>
      </a>
    </div>
  </section>
</main>
</body>
</html>
